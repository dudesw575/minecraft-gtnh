name: Build GTNH Docker image

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        required: true
        default: stable
        type: choice
        options:
          - stable
          - beta
          - nightly
      version:
        description: Optional exact GTNH version to build
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: gtnh-${{ inputs.channel || 'stable' }}
  cancel-in-progress: false

env:
  IMAGE: dudesw575/mc-gtnh
  DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || 'dudesw575' }}

jobs:
  discover:
    name: Discover GTNH release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      server_url: ${{ steps.meta.outputs.server_url }}
      filename: ${{ steps.meta.outputs.filename }}
      expected_sha256: ${{ steps.meta.outputs.expected_sha256 }}
      sha256: ${{ steps.download.outputs.sha256 }}
      build: ${{ steps.existing.outputs.build }}
      tags: ${{ steps.tags.outputs.tags }}
      channel: ${{ steps.channel.outputs.channel }}
    steps:
      - name: Checkout
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      - name: Resolve channel
        id: channel
        shell: bash
        run: |
          channel='${{ inputs.channel }}'
          if [ -z "$channel" ]; then channel='stable'; fi
          printf 'channel=%s\n' "$channel" >> "$GITHUB_OUTPUT"

      - name: Discover official GTNH server pack
        id: meta
        shell: bash
        run: |
          version='${{ inputs.version }}'
          bash scripts/discover-gtnh.sh '${{ steps.channel.outputs.channel }}' "$version" | tee metadata.txt
          cat metadata.txt >> "$GITHUB_OUTPUT"

      - name: Check Docker Hub for immutable version tag
        id: existing
        shell: bash
        run: |
          status="$(curl -sS -o /dev/null -w '%{http_code}' \
            "https://hub.docker.com/v2/namespaces/dudesw575/repositories/mc-gtnh/tags/${{ steps.meta.outputs.version }}")"
          if [ "$status" = '200' ]; then
            echo 'build=false' >> "$GITHUB_OUTPUT"
            echo "Image tag ${{ steps.meta.outputs.version }} already exists; skipping build."
          elif [ "$status" = '404' ]; then
            echo 'build=true' >> "$GITHUB_OUTPUT"
          else
            echo "Unexpected Docker Hub response: HTTP $status" >&2
            exit 1
          fi

      - name: Download official server pack
        if: steps.existing.outputs.build == 'true'
        shell: bash
        run: |
          curl -fL --retry 5 --retry-all-errors --connect-timeout 30 \
            '${{ steps.meta.outputs.server_url }}' \
            -o '${{ steps.meta.outputs.filename }}'
          test -s '${{ steps.meta.outputs.filename }}'

      - name: Verify server-pack checksum
        if: steps.existing.outputs.build == 'true'
        id: download
        shell: bash
        run: |
          actual="$(sha256sum '${{ steps.meta.outputs.filename }}' | awk '{print $1}')"
          expected='${{ steps.meta.outputs.expected_sha256 }}'
          if [ -n "$expected" ] && [ "$actual" != "$expected" ]; then
            echo "GTNH upstream checksum mismatch: expected $expected, got $actual" >&2
            exit 1
          fi
          echo "sha256=$actual" >> "$GITHUB_OUTPUT"
          echo "Server-pack archive SHA-256: $actual"

      - name: Calculate image tags
        if: steps.existing.outputs.build == 'true'
        id: tags
        shell: bash
        run: |
          version='${{ steps.meta.outputs.version }}'
          channel='${{ steps.channel.outputs.channel }}'
          major_minor="$(printf '%s' "$version" | sed -E 's/^([0-9]+\.[0-9]+)\..*/\1/')"
          case "$channel" in
            stable)
              printf -v tags '%s\n%s\n%s' "${IMAGE}:${version}" "${IMAGE}:${major_minor}" "${IMAGE}:latest"
              ;;
            beta)
              printf -v tags '%s\n%s\n%s' "${IMAGE}:${version}" "${IMAGE}:${major_minor}" "${IMAGE}:beta"
              ;;
            nightly)
              printf -v tags '%s\n%s\n%s' "${IMAGE}:${version}" "${IMAGE}:${major_minor}-nightly" "${IMAGE}:nightly"
              ;;
          esac
          printf 'tags<<EOF\n%s\nEOF\n' "$tags" >> "$GITHUB_OUTPUT"

      - name: Upload server pack for build job
        if: steps.existing.outputs.build == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gtnh-server-pack-${{ steps.meta.outputs.version }}
          path: ${{ steps.meta.outputs.filename }}
          if-no-files-found: error
          retention-days: 1

  build-test-publish:
    name: Build, smoke-test, scan, publish
    needs: discover
    if: needs.discover.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      - name: Download server pack artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: gtnh-server-pack-${{ needs.discover.outputs.version }}
          path: server-pack

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build image for testing
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          load: true
          push: false
          tags: gtnh-ci:${{ needs.discover.outputs.version }}
          build-args: |
            GTNH_VERSION=${{ needs.discover.outputs.version }}
            GTNH_SERVER_URL=${{ needs.discover.outputs.server_url }}
            GTNH_SERVER_FILENAME=${{ needs.discover.outputs.filename }}
            GTNH_SERVER_SHA256=${{ needs.discover.outputs.sha256 }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp || github.run_started_at }}
          build-contexts: |
            gtnh_server_pack=server-pack
          cache-from: type=gha,scope=gtnh-${{ needs.discover.outputs.channel }}
          cache-to: type=gha,mode=max,scope=gtnh-${{ needs.discover.outputs.channel }}
          provenance: false
          sbom: false

      - name: Smoke-test server startup
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p smoke-data
          container='gtnh-smoke'
          cleanup() {
            docker logs "$container" > smoke-server.log 2>&1 || true
            docker stop -t 30 "$container" >/dev/null 2>&1 || true
            docker rm -f "$container" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run -d --name "$container" \
            -e EULA=TRUE \
            -e MEMORY=6G \
            -p 25565:25565 \
            -v "$PWD/smoke-data:/minecraft" \
            "gtnh-ci:${{ needs.discover.outputs.version }}"

          deadline=$((SECONDS + 900))
          ready=false
          port_ready=false
          while [ "$SECONDS" -lt "$deadline" ]; do
            if ! docker inspect -f '{{.State.Running}}' "$container" 2>/dev/null | grep -qx true; then
              echo 'GTNH server process exited before reaching ready state.' >&2
              docker logs "$container" >&2 || true
              exit 1
            fi

            if timeout 2 bash -c '</dev/tcp/127.0.0.1/25565' 2>/dev/null; then
              port_ready=true
              echo 'Minecraft TCP port 25565 is listening.'
            fi

            if docker logs "$container" 2>&1 | grep -q 'Done ('; then
              ready=true
              break
            fi
            sleep 5
          done

          if [ "$ready" != true ]; then
            echo 'Timed out waiting for GTNH server readiness.' >&2
            docker logs "$container" >&2 || true
            exit 1
          fi
          if [ "$port_ready" != true ]; then
            echo 'GTNH reported ready but TCP port 25565 never became reachable.' >&2
            docker logs "$container" >&2 || true
            exit 1
          fi

          docker logs "$container" > smoke-server.log
          test "$(docker inspect -f '{{.State.Running}}' "$container")" = true
          echo 'GTNH smoke test passed.'

      - name: Upload smoke-test logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gtnh-smoke-logs-${{ needs.discover.outputs.version }}
          path: smoke-server.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: gtnh-ci:${{ needs.discover.outputs.version }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Login to Docker Hub
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push tested image tags
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            echo "Publishing $tag"
            docker tag "gtnh-ci:${{ needs.discover.outputs.version }}" "$tag"
            docker push "$tag"
          done <<'EOF'
          ${{ needs.discover.outputs.tags }}
          EOF
